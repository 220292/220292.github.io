<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Tin tức công nghệ</title>
<style>
:root{--ink:#182235;--muted:#7c8798;--line:#e8edf3;--accent:#e34d36;--bg:#f4f6f9;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:inherit;text-decoration:none}.top{background:#111827;color:white}.top-inner{max-width:1080px;margin:auto;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:850;letter-spacing:-.5px}.mark{width:31px;height:31px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-weight:900}.source{font-size:12px;color:#aeb8c7}
main{max-width:1080px;margin:28px auto 50px;padding:0 24px}.heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:17px}.heading h1{font-size:22px;letter-spacing:-.5px;margin:0}.heading p{margin:3px 0 0;color:var(--muted);font-size:12px}
.tools{display:flex;align-items:center;gap:12px}.status{font-size:11px;color:var(--muted)}button{border:0;background:#182235;color:white;padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer}button:hover{background:var(--accent)}button:disabled{opacity:.6;cursor:wait}
.list{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 8px 28px rgba(25,40,65,.05)}
.item{display:grid;grid-template-columns:148px minmax(0,1fr);gap:19px;padding:17px 19px;border-bottom:1px solid var(--line);min-height:132px}.item:last-child{border-bottom:0}.thumb{width:148px;height:98px;object-fit:cover;border-radius:8px;background:#edf0f4;align-self:start}.thumb-placeholder{width:148px;height:98px;border-radius:8px;background:linear-gradient(135deg,#edf0f4,#e1e6ed);display:grid;place-items:center;color:#9ba5b4;font-size:11px}
.item-content{min-width:0}.item-title{font-size:16px;line-height:1.38;font-weight:780;display:block;margin:1px 0 7px;letter-spacing:-.2px}.item-title:hover{color:var(--accent)}.summary{font-size:13px;color:#687487;line-height:1.55;margin:0 0 9px}.meta{display:flex;align-items:center;gap:8px;color:#929cac;font-size:11px}.source-label{color:var(--accent);font-weight:750;text-transform:uppercase;letter-spacing:.7px;font-size:10px}
.loading,.error{padding:42px 20px;text-align:center;color:var(--muted)}.spinner{width:23px;height:23px;border:3px solid #e6eaf0;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}
.bottom{max-width:1080px;margin:-32px auto 30px;padding:0 24px;color:#8a94a4;font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.bottom a{text-decoration:underline;color:#5d687a}
@media(max-width:600px){.top-inner{padding:13px 16px}.source{display:none}main{padding:0 13px;margin:19px auto 45px}.heading{align-items:flex-start;flex-direction:column}.tools{width:100%;justify-content:space-between}.item{grid-template-columns:104px minmax(0,1fr);gap:12px;padding:13px}.thumb,.thumb-placeholder{width:104px;height:78px}.item-title{font-size:14px}.summary{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bottom{padding:0 14px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <a class="brand" href="https://trangcongnghe.com.vn/" target="_blank" rel="noopener"><span class="mark">T</span><span>TRANG CÔNG NGHỆ</span></a>
  <span class="source">Nguồn tin: trangcongnghe.com.vn</span>
</div></header>
<main>
  <div class="heading">
    <div><h1>Tin tức mới nhất</h1><p>Danh sách bài viết được cập nhật tự động từ nguồn RSS</p></div>
    <div class="tools"><span class="status" id="status">Đang kết nối nguồn tin…</span><button id="refresh" type="button">↻ &nbsp; Làm mới</button></div>
  </div>
  <section class="list" id="news"><div class="loading"><div class="spinner"></div>Đang tải danh sách tin tức…</div></section>
</main>
<footer class="bottom"><span>Nội dung và hình ảnh thuộc quyền sở hữu của trangcongnghe.com.vn.</span><span><a href="https://trangcongnghe.com.vn/rss.xml" target="_blank" rel="noopener">Mở RSS nguồn</a></span></footer>
<script>
(() => {
  const FEED='https://trangcongnghe.com.vn/rss.xml';
  const root=document.getElementById('news'),status=document.getElementById('status'),btn=document.getElementById('refresh');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const plain=s=>{const d=new DOMParser().parseFromString(String(s||''),'text/html');return(d.body.textContent||'').replace(/\s+/g,' ').trim()};
  const first=(el,selectors)=>{for(const q of selectors){const n=el.querySelector(q);if(n){const v=n.getAttribute('url')||n.getAttribute('href')||n.textContent;if(v)return v.trim()}}return''};
  function parse(xml){
    const doc=new DOMParser().parseFromString(xml,'text/xml');if(doc.querySelector('parsererror'))throw Error('RSS không hợp lệ');
    return [...doc.querySelectorAll('item,entry')].map(n=>{
      const title=plain(first(n,['title']));
      let link=first(n,['link[rel="alternate"]','link']);if(!link)link=first(n,['guid','id']);
      let desc=first(n,['description','summary','content\\:encoded','content']);
      let img=first(n,['media\\:content','media\\:thumbnail','enclosure[type^="image"]']);
      if(!img){const raw=n.querySelector('description,summary,content')?.textContent||'';img=new DOMParser().parseFromString(raw,'text/html').querySelector('img')?.getAttribute('src')||''}
      const dt=first(n,['pubDate','published','updated','dc\\:date']);
      return{title,link,img,desc:plain(desc),date:dt?new Date(dt):null};
    }).filter(x=>x.title&&x.link);
  }
  function dateLabel(d){if(!d||isNaN(d))return'Nguồn RSS';return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d)}
  function render(items){
    root.innerHTML=items.map((x,i)=>{
      const thumb=x.img?`<img class="thumb" src="${esc(x.img)}" alt="" loading="${i<4?'eager':'lazy'}" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=&quot;thumb-placeholder&quot;>Tin công nghệ</div>'">`:`<div class="thumb-placeholder">Tin công nghệ</div>`;
      const summary=x.desc?x.desc.slice(0,230)+(x.desc.length>230?'…':''):'';
      return `<article class="item">${thumb}<div class="item-content"><a class="item-title" href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.title)}</a>${summary?`<p class="summary">${esc(summary)}</p>`:''}<div class="meta"><span class="source-label">Tin công nghệ</span><span>·</span><time>${esc(dateLabel(x.date))}</time></div></div></article>`;
    }).join('');
  }
  async function load(){
    btn.disabled=true;btn.textContent='Đang tải…';status.textContent='Đang cập nhật…';root.innerHTML='<div class="loading"><div class="spinner"></div>Đang tải danh sách tin tức…</div>';
    const attempts=[
      async()=>{const r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(FEED),{cache:'no-store'});if(!r.ok)throw 0;return parse(await r.text())},
      async()=>{const r=await fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(FEED),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(j.status!=='ok')throw 0;return(j.items||[]).map(x=>({title:plain(x.title),link:x.link,img:x.thumbnail||x.enclosure?.link||'',desc:plain(x.description||x.content),date:x.pubDate?new Date(x.pubDate):null})).filter(x=>x.title&&x.link)}
    ];
    for(const attempt of attempts){try{const items=await attempt();if(!items.length)throw 0;render(items);status.textContent=`${items.length} bài viết · cập nhật ${new Intl.DateTimeFormat('vi-VN',{hour:'2-digit',minute:'2-digit'}).format(new Date())}`;btn.disabled=false;btn.textContent='↻  Làm mới';return}catch(e){}}
    root.innerHTML='<div class="error"><strong>Không thể tải danh sách tin tức.</strong><p>RSS có thể đang chặn truy cập từ trình duyệt hoặc dịch vụ trung gian tạm thời không hoạt động.</p><a href="https://trangcongnghe.com.vn/rss.xml" target="_blank" rel="noopener">Mở trực tiếp file RSS →</a></div>';
    status.textContent='Chưa kết nối được';btn.disabled=false;btn.textContent='↻  Thử lại';
  }
  btn.addEventListener('click',load);load();setInterval(load,300000);
})();
</script>
</body>
</html>
